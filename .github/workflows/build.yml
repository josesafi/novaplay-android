# Nova Play para Android: compila el APK en cada cambio (repositorio publico = minutos gratis)
name: Build Nova Play (Android)
permissions:
  contents: read

on:
  workflow_dispatch:
  push:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOVA_VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK y NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;29.0.14206865'

      - name: Version de Nova Play (1.0.<compilacion>)
        run: |
          sed -i "s/versionName \"1.0\"/versionName \"${NOVA_VERSION}\"/" app/build.gradle
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle
          grep -n "versionName\|versionCode" app/build.gradle

      - name: Llave fija de prueba (para que cada version se instale encima de la anterior)
        env:
          KEYSTORE_B64: ${{ secrets.NOVAPLAY_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          ls -la ~/.android/debug.keystore

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleNonRootDebug

      - name: Subir APK
        uses: actions/upload-artifact@v6
        with:
          name: NovaPlay-android-${{ env.NOVA_VERSION }}
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
